<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Carona - Conexão Chapada</title>

    <meta property="og:site_name" content="Conexão Chapada">
    <meta property="og:title" content="Ofereça ou Peça sua Carona para a Chapada!">
    <meta property="og:description" content="Cadastro rápido e gratuito. Conecte-se com outros viajantes agora mesmo.">
    <meta property="og:image" content="https://conexaochapada.bots.at.eu.org/img/conexao-chapada-foto.jpeg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#15803d">
    <link rel="apple-touch-icon" href="/img/conexao-chapada-192-pwa.png">
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(() => console.log('Service Worker registrado! 🟢'))
                    .catch((err) => console.log('Falha no SW 🔴', err));
            });
        }
    </script>>
</head>
<body class="bg-stone-50 text-stone-800 font-sans min-h-screen flex flex-col selection:bg-green-200">
        <header class="bg-gradient-to-r from-green-700 to-green-500 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-6 flex justify-between items-center">
            <a href="/" class="group">
                <h1 class="text-2xl font-bold tracking-tight flex items-center gap-2 group-hover:opacity-90 transition">
                    Conexão Chapada <span class="text-xs bg-white/20 px-2 py-1 rounded-full uppercase tracking-wider border border-white/10">Beta</span>
                </h1>
                <p class="text-sm text-green-100 mt-1 opacity-90 group-hover:underline decoration-green-300/50 underline-offset-2">Caronas solidárias num pulo!</p>
            </a>
            
            <div class="space-x-2 hidden md:flex">
                <a href="form.html?type=offer" class="px-4 py-2 bg-white/20 hover:bg-white/30 backdrop-blur-sm rounded-lg text-sm font-bold transition border border-white/10 shadow-sm">Oferecer</a>
                <a href="form.html?type=request" class="px-4 py-2 bg-white/20 hover:bg-white/30 backdrop-blur-sm rounded-lg text-sm font-bold transition border border-white/10 shadow-sm">Solicitar</a>
            </div>
             <a href="/" class="md:hidden px-3 py-2 bg-white/20 hover:bg-white/30 rounded-lg text-sm font-bold transition border border-white/10">
                ✕ Voltar
            </a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-6 w-full flex-1">
        
        <div id="highlightContainer" class="mb-6 relative overflow-hidden rounded-xl transition-all duration-500 opacity-0 scale-95 shadow-sm min-h-[100px]">
            </div>

        <h1 class="text-2xl font-bold text-stone-800 mb-4" id="formTitle">Formulário de Carona</h1>
        
        <form id="rideForm" class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200 space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Nome do Usuário</label>
                <input type="text" id="name" required placeholder="Seu nome completo" class="w-full p-2.5 border border-stone-200 rounded-xl bg-stone-50 text-sm focus:ring-2 focus:ring-green-500 outline-none transition" />
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="block text-sm font-medium mb-1">Origem</label><select id="origem" required class="w-full p-2.5 border border-stone-200 rounded-xl bg-stone-50 text-sm focus:ring-2 focus:ring-green-500 outline-none transition"></select></div>
                <div><label class="block text-sm font-medium mb-1">Destino</label><select id="destino" required class="w-full p-2.5 border border-stone-200 rounded-xl bg-stone-50 text-sm focus:ring-2 focus:ring-green-500 outline-none transition"></select></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="block text-sm font-medium mb-1">Data</label><input type="date" id="data" required class="w-full p-2.5 border border-stone-200 rounded-xl bg-stone-50 text-sm focus:ring-2 focus:ring-green-500 outline-none transition" /></div>
                <div><label class="block text-sm font-medium mb-1">Hora</label><input type="time" id="hora" required class="w-full p-2.5 border border-stone-200 rounded-xl bg-stone-50 text-sm focus:ring-2 focus:ring-green-500 outline-none transition" /></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="block text-sm font-medium mb-1">Valor (R$)</label><input type="number" id="valor" required min="0" step="0.01" placeholder="0,00" class="w-full p-2.5 border border-stone-200 rounded-xl bg-stone-50 text-sm focus:ring-2 focus:ring-green-500 outline-none transition" /></div>
                <div><label class="block text-sm font-medium mb-1">Vagas</label><input type="number" id="vagas" required min="1" value="1" class="w-full p-2.5 border border-stone-200 rounded-xl bg-stone-50 text-sm focus:ring-2 focus:ring-green-500 outline-none transition" /></div>
            </div>
            <div class="flex gap-4 items-center flex-wrap">
                <label class="inline-flex items-center gap-2 cursor-pointer select-none"><input type="checkbox" id="pet" class="rounded text-green-600 focus:ring-green-500 w-5 h-5" /><span class="text-sm">Pet</span></label>
                <label class="inline-flex items-center gap-2 cursor-pointer select-none"><input type="checkbox" id="encomenda" class="rounded text-green-600 focus:ring-green-500 w-5 h-5" /><span class="text-sm">Encomenda</span></label>
                <label class="inline-flex items-center gap-2 cursor-pointer select-none"><input type="checkbox" id="mala_g" class="rounded text-green-600 focus:ring-green-500 w-5 h-5" /><span class="text-sm">Mala G</span></label>
                <label class="inline-flex items-center gap-2 cursor-pointer select-none bg-pink-50 px-3 py-1 rounded-lg border border-pink-100"><input type="checkbox" id="only_woman" class="rounded text-pink-500 focus:ring-pink-500 w-5 h-5" /><span class="text-sm font-bold text-pink-600">👩 Só Mulheres</span></label>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Telefone (WhatsApp)</label>
                <input type="tel" id="phone" required placeholder="DDD + Número" class="w-full p-2.5 border border-stone-200 rounded-xl bg-stone-50 text-sm focus:ring-2 focus:ring-green-500 outline-none transition" />
            </div>

            <div class="mt-4 p-4 bg-yellow-50 rounded-xl border border-yellow-100">
                <label class="block text-sm font-bold text-yellow-800 mb-1">🔒 Senha para Excluir (PIN)</label>
                <div class="text-xs text-yellow-700 mb-2">Crie uma senha simples (ex: 1234) para apagar seu anúncio depois.</div>
                <input type="text" id="secret_code" required maxlength="6" placeholder="Ex: 1234" class="w-full p-2.5 border border-yellow-200 rounded-xl bg-white text-center text-lg tracking-widest font-bold focus:ring-2 focus:ring-yellow-500 outline-none transition" />
            </div>

            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold transition shadow-lg shadow-green-200">Enviar Carona</button>
        </form>

        <div id="successMsg" class="hidden mt-4 p-4 bg-green-100 text-green-700 rounded-xl text-center font-medium border border-green-200 animate-pulse">
            ✅ Carona enviada com sucesso! Redirecionando...
        </div>

    </main>
<footer class="bg-gray-100 border-t border-stone-200 py-8 mt-auto">
    <div class="max-w-3xl mx-auto px-4 text-center">
        
        <div class="flex flex-wrap justify-center gap-3 mb-6">
            <a href="ajuda.html" class="inline-flex items-center gap-1 text-green-700 font-bold hover:bg-green-100 bg-green-50 px-4 py-2 rounded-lg text-sm border border-green-100 transition">
                ❓ Como usar
            </a>
            <a href="termos.html" class="inline-flex items-center gap-1 text-stone-600 font-medium hover:bg-stone-200 bg-stone-100 px-4 py-2 rounded-lg text-sm border border-stone-200 transition">
                ⚖️ Termos e Segurança
            </a>
        </div>

        <p class="text-sm text-gray-500 mb-1">Conexão Chapada - Beta</p>
        <a href="https://zeballos.com.br" target="_blank" class="text-xs text-gray-400 hover:text-green-600 transition font-medium">
            &copy; <span id="year"></span> Zeballos Tecnologia
        </a>
    </div>
</footer>
    <script src="form.js" charset="UTF-8"></script>
</body>
</html>
